<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一次ソース更新ウォッチ</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f1f1f;--sub:#666;--line:#e6e2d9;--ok:#2e7d32;--ng:#b3261e;--chg:#b45309;--acc:#0f4c81}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#eee;--sub:#aaa;--line:#333;--acc:#7fb3ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-height:1.6}
header{padding:28px 20px 12px;max-width:960px;margin:0 auto}h1{font-size:22px;margin:0 0 6px}.lead{color:var(--sub);font-size:14px;margin:0}
main{max-width:960px;margin:0 auto;padding:0 20px 60px}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}.sum span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;color:#fff;background:var(--sub)}.b-changed{background:var(--chg)}.b-same{background:var(--ok)}.b-failed{background:var(--ng)}.b-first{background:var(--acc)}
.meta{font-size:13px;color:var(--sub);margin:0 0 6px}.meta a{color:var(--acc);word-break:break-all}
.diff{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;background:rgba(127,127,127,.08);border-radius:8px;padding:8px 10px;margin:8px 0 0}
.add{color:var(--ok)}.del{color:var(--ng)}
details{margin-top:6px}summary{cursor:pointer;color:var(--acc);font-size:13px}
h3{font-size:15px;margin:30px 0 10px}
.hist{font-size:13px;border-left:3px solid var(--line);padding-left:12px;margin:0 0 12px}.hist b{display:block}
footer{max-width:960px;margin:0 auto;padding:0 20px 40px;color:var(--sub);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>一次ソース更新ウォッチ</h1>
  <p class="lead">財務省・日銀・金融庁・SEC・BIS・米財務省・MAS の公開ページを毎朝チェックし、変わった所だけを出します。<span id="gen"></span></p>
</header>
<main>
  <div class="sum" id="sum"></div>
  <div id="items"></div>
  <h3>変化の履歴</h3>
  <div id="hist"></div>
</main>
<footer>データは <code>data.json</code>（Go製 <a href="https://github.com/anpon10/srcwatch">srcwatch</a> が生成）。差分は行の集合の差＝順序の入れ替えは無視。取得失敗はサイト側の遮断や停止を含みます。</footer>
<script>
const L={changed:"変化あり",same:"変化なし",failed:"取得失敗",first:"初回登録"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("data.json?t="+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById("gen").textContent=" 最終チェック "+d.generated_at+"（日本時間）";
  const s=d.summary||{};
  document.getElementById("sum").innerHTML=["changed","same","first","failed"].filter(k=>s[k]).map(k=>`<span>${L[k]} ${s[k]}</span>`).join("");
  const order={changed:0,failed:1,first:2,same:3};
  const items=[...(d.items||[])].sort((a,b)=>order[a.result]-order[b.result]);
  document.getElementById("items").innerHTML=items.map(it=>{
    const diff=(it.added||[]).map(l=>`<span class="add">+ ${esc(l)}</span>`).concat((it.removed||[]).map(l=>`<span class="del">- ${esc(l)}</span>`)).join("\n");
    const more=(it.added_more||0)+(it.removed_more||0);
    return `<div class="card"><h2><span class="badge b-${it.result}">${L[it.result]||it.result}</span>${esc(it.name)}</h2>
      <p class="meta"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.url)}</a><br>${it.note?esc(it.note)+"　":""}前回の変化 ${esc(it.changed_at||"—")}　行数 ${it.line_count||0}${it.err?"　<span class=del>"+esc(it.err)+"</span>":""}</p>
      ${diff?`<details open><summary>変わった行</summary><div class="diff">${diff}${more?`\n…ほか${more}行`:""}</div></details>`:""}</div>`;
  }).join("");
  document.getElementById("hist").innerHTML=(d.history||[]).slice(0,50).map(h=>`<div class="hist"><b>${esc(h.at)}　${esc(h.name)}</b>${(h.added||[]).slice(0,3).map(l=>`<span class="add">+ ${esc(l)}</span>`).join("<br>")}${(h.removed||[]).slice(0,2).map(l=>`<br><span class="del">- ${esc(l)}</span>`).join("")}</div>`).join("")||"<p class=meta>まだ変化はありません。</p>";
}).catch(e=>{document.getElementById("items").innerHTML="<p class=meta>data.json を読めませんでした。"+esc(e)+"</p>";});
</script>
</body>
</html>
